<!-- Quadratischer Ausschnitt: im Hochformat (Handy) gross genug, auf breiten Bildschirmen
     füllt #splashscreen den Rand mit derselben Hintergrundfarbe -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="420 0 1080 1080" width="1080" height="1080">
  <title>STEFFLIX</title>
  <defs>
    <!-- Band des Logos: oben hell, unten dunkel, fliessender Übergang -->
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="414">
      <stop offset="0.30" stop-color="#e8261a"/>
      <stop offset="0.68" stop-color="#a81a0f"/>
    </linearGradient>
    <!-- Lichtkegel von oben: oben hell, nach unten auslaufend -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Lichtfleck am Boden -->
    <radialGradient id="floor" cx="960" cy="894" r="330" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(960 894) scale(1 0.16) translate(-960 -894)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e8261a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8261a"/>
      <stop offset="1" stop-color="#e8261a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* Ablauf (ca. 2.7 s): Band zeichnet sich, ab der Hälfte schaltet der Lichtkegel flackernd ein,
       danach Schriftzug, Linie, Untertitel */
    .band { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards; }
    .beam { opacity: 0; animation: flicker 0.6s linear 0.7s forwards; }
    .word { opacity: 0; letter-spacing: 0.42em; animation: word 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
    .line { transform-origin: 960px 0; transform: scaleX(0); animation: grow 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s forwards; }
    .tag  { opacity: 0; animation: fadeIn 0.8s ease-out 1.9s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes flicker {
      0% { opacity: 0; } 8% { opacity: 0.75; } 16% { opacity: 0.1; } 26% { opacity: 0.9; }
      34% { opacity: 0.25; } 46% { opacity: 0.6; } 52% { opacity: 0.35; } 100% { opacity: 1; }
    }
    @keyframes word { to { opacity: 1; letter-spacing: 0.22em; } }
    @keyframes grow { to { transform: scaleX(1); } }
    /* Ohne Animationen (Systemeinstellung): direkt das fertige Bild, Licht ohne Flackern */
    @media (prefers-reduced-motion: reduce) {
      .beam, .word, .tag { opacity: 1; animation: none; }
      .band { stroke-dashoffset: 0; animation: none; }
      .word { letter-spacing: 0.22em; }
      .line { transform: none; animation: none; }
    }
  </style>
  <rect width="1920" height="1080" fill="#0b0b0d"/>
  <g class="beam">
    <polygon points="894,-30 1026,-30 1267,912 653,912" fill="url(#beam)" filter="url(#soft)"/>
    <rect width="1920" height="1080" fill="url(#floor)"/>
  </g>
  <g transform="translate(960 430) scale(0.92) translate(-256 -256)">
    <path class="band" pathLength="1" d="M362 170C334 120 176 112 166 196C158 244 214 252 258 262C304 272 354 284 350 334C344 414 186 414 150 346" fill="none" stroke="url(#band)" stroke-width="84" stroke-linecap="butt"/>
  </g>
  <text class="word" x="972" y="780" text-anchor="middle" fill="#ededed" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="800">STEFFLIX</text>
  <rect class="line" x="700" y="820" width="520" height="4" rx="2" fill="url(#line)"/>
  <text class="tag" x="960" y="888" text-anchor="middle" fill="#a0a0aa" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" letter-spacing="0.3em">FILME · SERIEN · MUSIK · BILDER</text>
</svg>
