<!-- Quadratischer Ausschnitt: im Hochformat (Handy) gross genug, auf breiten Bildschirmen
     füllt #splashscreen den Rand mit derselben Hintergrundfarbe -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="420 0 1080 1080" width="1080" height="1080">
  <title>STEFFLIX</title>
  <defs>
    <!-- Band des Logos: oben hell, unten dunkel, fliessender Übergang -->
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="414">
      <stop offset="0.30" stop-color="#e50914"/>
      <stop offset="0.68" stop-color="#a30610"/>
    </linearGradient>
    <!-- Rotes Leuchten hinter dem Logo -->
    <radialGradient id="glow" cx="960" cy="430" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#e50914" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e50914" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e50914"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* Ablauf (ca. 2 s): Leuchten, Band zeichnet sich, Schriftzug, Linie, Untertitel */
    .glow { opacity: 0; animation: fadeIn 1.2s ease-out 0.1s forwards; }
    .band { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards; }
    .word { opacity: 0; letter-spacing: 0.42em; animation: word 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.9s forwards; }
    .line { transform-origin: 960px 0; transform: scaleX(0); animation: grow 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.3s forwards; }
    .tag  { opacity: 0; animation: fadeIn 0.8s ease-out 1.6s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes word { to { opacity: 1; letter-spacing: 0.22em; } }
    @keyframes grow { to { transform: scaleX(1); } }
    /* Ohne Animationen (Systemeinstellung): direkt das fertige Bild */
    @media (prefers-reduced-motion: reduce) {
      .glow, .word, .tag { opacity: 1; animation: none; }
      .band { stroke-dashoffset: 0; animation: none; }
      .word { letter-spacing: 0.22em; }
      .line { transform: none; animation: none; }
    }
  </style>
  <rect width="1920" height="1080" fill="#0b0b0d"/>
  <rect class="glow" width="1920" height="1080" fill="url(#glow)"/>
  <g transform="translate(960 430) scale(0.92) translate(-256 -256)">
    <path class="band" pathLength="1" d="M362 170C334 120 176 112 166 196C158 244 214 252 258 262C304 272 354 284 350 334C344 414 186 414 150 346" fill="none" stroke="url(#band)" stroke-width="84" stroke-linecap="butt"/>
  </g>
  <text class="word" x="972" y="780" text-anchor="middle" fill="#ededed" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="112" font-weight="800">STEFFLIX</text>
  <rect class="line" x="700" y="820" width="520" height="4" rx="2" fill="url(#line)"/>
  <text class="tag" x="960" y="888" text-anchor="middle" fill="#a0a0aa" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" letter-spacing="0.3em">FILME · SERIEN · MUSIK · BILDER</text>
</svg>
